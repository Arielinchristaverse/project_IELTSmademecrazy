{# 근무 유형별 공부 시간·알림 시각 간단 입력 표 (온보딩). 필요: shifts, (back) #}
<table class="list">
  <tr><th>근무 유형</th><th>공부 가능 시간(분)</th><th>알림 시각</th><th></th></tr>
  {% for s in shifts %}
  <tr>
    <td>
      <span class="shift-dot" style="--dot: {{ s.color_hex or 'var(--border-grid)' }}"></span>
      {{ s.label }}{% if s.is_rest_day %} <span class="tag accent">쉬는 날</span>{% endif %}
      {% if s.hours_text %}<div class="fine">{{ s.hours_text }}</div>{% endif %}
    </td>
    <td><input type="number" min="0" max="1440" step="5" name="{{ s.code }}_minutes" value="{{ s.study_minutes }}" style="width:96px" inputmode="numeric"></td>
    <td><input type="time" name="{{ s.code }}_time" value="{{ s.send_time.strftime('%H:%M') }}"></td>
    <td style="text-align:right"><a href="/settings/shifts/{{ s.id }}?back={{ back or '/settings' }}">편집</a></td>
  </tr>
  {% endfor %}
</table>
