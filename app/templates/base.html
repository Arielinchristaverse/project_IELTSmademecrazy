<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Study Shift{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f2a44">
  <!-- iOS 홈 화면 앱 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Study Shift">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% block header %}
<header><div class="inner">
  <span class="brand">Study Shift</span>
  {% set p = request.url.path %}
  <nav>
    <a href="/" class="{{ 'on' if p == '/' }}">이번 주</a>
    <a href="/calendar" class="{{ 'on' if p.startswith('/calendar') }}">근무 달력</a>
    <a href="/tasks" class="{{ 'on' if p.startswith('/tasks') }}">과제</a>
    <a href="/settings" class="{{ 'on' if p.startswith('/settings') }}">설정</a>
    <a href="/sentences" class="{{ 'on' if p.startswith('/sentences') }}">영어 문장</a>
  </nav>
  <a href="/account" class="{{ 'on' if p.startswith('/account') }}" style="font-size:14px;color:var(--muted)">계정</a>
</div></header>
{% endblock %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
