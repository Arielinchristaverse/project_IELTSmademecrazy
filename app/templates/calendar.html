{% extends "base.html" %}
{% block content %}
<div class="row">
  <div>
    <h1>{{ year }}년 {{ month }}월 근무</h1>
    <p class="sub">날짜별 근무 유형을 고르고, 공부가 어려운 날은 '제외'에 체크하세요.</p>
  </div>
  <div class="spacer"></div>
  <a class="btn ghost" href="/calendar?month={{ prev }}">← 이전 달</a>
  <a class="btn ghost" href="/calendar?month={{ next }}">다음 달 →</a>
</div>
{% if saved %}<div class="notice">저장했습니다. 이미 생성한 주가 있다면 '이번 주'에서 배정을 다시 생성하세요.</div>{% endif %}
{% include "partials/calendar_form.html" %}
{% endblock %}
